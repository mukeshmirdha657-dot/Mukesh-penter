<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1565c0">
<title>Mukesh Painter App</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#eef3f8;font-family:Arial,sans-serif;color:#18212b}
.app{max-width:480px;margin:auto;min-height:100vh;background:#f7f9fb}
header{background:linear-gradient(135deg,#0d47a1,#1976d2);color:white;padding:18px 16px 20px;border-radius:0 0 24px 24px;text-align:center}
.logo{width:105px;height:105px;object-fit:contain;border-radius:50%;background:white;margin:auto;display:block}
h1{margin:9px 0 3px;font-size:25px} .sub{opacity:.9;font-size:13px}
.card{background:white;margin:14px;border-radius:18px;padding:16px;box-shadow:0 4px 14px #00000012}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;font-weight:bold;color:#555}
input,select{width:100%;padding:12px;margin-top:6px;margin-bottom:10px;border:1px solid #d7dde5;border-radius:10px;font-size:16px;background:#fff}
button{width:100%;border:0;border-radius:11px;padding:13px;font-size:16px;font-weight:bold;background:#1565c0;color:#fff;margin-top:4px}
.secondary{background:#e8f1fb;color:#1565c0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px 7px;border-radius:12px;background:#f2f6fa;text-align:center}
.stat b{display:block;font-size:18px;margin-top:4px}
.total{background:#e3f2fd;color:#0d47a1}
.due{background:#fff3e0;color:#e65100}
.paid{background:#e8f5e9;color:#2e7d32}
.small{font-size:12px;color:#777}
</style>
</head>

<h1>Mukesh Painter</h1>
<div class="sub">House • Room • Office • Building</div>
</header>

<div class="card">
<h2>👤 Customer Details</h2>
<div class="grid">
<div><label>Customer Name</label><input id="name" placeholder="नाम"></div>
<div><label>Mobile</label><input id="mobile" placeholder="मोबाइल" inputmode="numeric"></div>
</div>
<label>📍 Work Location</label>
<input id="location" placeholder="काम की जगह / Address">
<div class="grid">
<div><label>Date</label><input id="date" type="date"></div>
<div><label>Time</label><input id="time" type="time"></div>
</div>
</div>

<div class="card">
<h2>📏 Work Estimate</h2>
<div class="grid">
<div><label>Length (ft)</label><input id="length" type="number" placeholder="0"></div>
<div><label>Width (ft)</label><input id="width" type="number" placeholder="0"></div>
</div>
<label>Rate ₹ / sq.ft</label>
<input id="rate" type="number" placeholder="0">
<button onclick="calculate()">🧮 Calculate</button>
</div>

<div class="card">
<h2>💰 Payment</h2>
<div class="stats">
<div class="stat total">Total<b>₹<span id="total">0</span></b></div>
<div class="stat paid">Paid<b>₹<span id="paidShow">0</span></b></div>
<div class="stat due">Due<b>₹<span id="due">0</span></b></div>
</div>
<label style="display:block;margin-top:12px">Paid Amount ₹</label>
<input id="paid" type="number" placeholder="ग्राहक ने कितना दिया">
</div>

<div class="card">
<h2>👥 Customer Records</h2>
<button onclick="saveCustomer()">➕ Add / Save Customer</button>
<button id="newCustomer" class="secondary" onclick="newCustomer()">➕ Next Customer / नया Customer</button>
<p class="small">हर Customer Save होने के बाद उसका रिकॉर्ड इस फोन में सुरक्षित रहेगा।</p>
<button class="secondary" onclick="deleteAllCustomers()">🗑️ Delete All Customers</button>
<div id="customerList"></div>
</div>

<div class="card">
<h2>🧾 Estimate</h2>
<p id="summary" class="small">Details भरकर Calculate दबाएँ।</p>
<button onclick="share()">📲 WhatsApp पर भेजें</button>
<button class="secondary" onclick="window.print()">🖨️ Print / Save PDF</button>
</div>
</div>

<script>
const $ = id => document.getElementById(id);

function setNow(){
  const n = new Date();
  $('date').value = n.toISOString().slice(0,10);
  $('time').value = n.toTimeString().slice(0,5);
}
setNow();

function calculate(){
  const customer = $('name').value.trim();
  const mobileNo = $('mobile').value.trim();
  const l = parseFloat($('length').value) || 0;
  const w = parseFloat($('width').value) || 0;
  const r = parseFloat($('rate').value) || 0;
  const p = parseFloat($('paid').value) || 0;

  const area = l * w;
  const totalAmt = area * r;
  const dueAmt = Math.max(0, totalAmt - p);

  $('total').textContent = totalAmt.toFixed(2);
  $('paidShow').textContent = p.toFixed(2);
  $('due').textContent = dueAmt.toFixed(2);

  $('summary').innerHTML =
    'Customer: <b>' + (customer || '-') + '</b><br>' +
    'Mobile: ' + (mobileNo || '-') + '<br>' +
    'Date: ' + ($('date').value || '-') + ' | Time: ' + ($('time').value || '-') + '<br>' +
    'Area: ' + area.toFixed(2) + ' sq.ft<br>' +
    'Rate: ₹' + r.toFixed(2) + ' / sq.ft<br>' +
    'Total: ₹' + totalAmt.toFixed(2) +
    ' | Paid: ₹' + p.toFixed(2) +
    ' | Due: ₹' + dueAmt.toFixed(2);
}

function getCustomerData(){
 const l=+document.getElementById('length').value||0;
 const w=+document.getElementById('width').value||0;
 const r=+document.getElementById('rate').value||0;
 const p=+document.getElementById('paid').value||0;
 const area=l*w, totalAmt=area*r, dueAmt=Math.max(0,totalAmt-p);
 return {
  id:Date.now(), name:document.getElementById('name').value.trim(),
  mobile:document.getElementById('mobile').value.trim(),
  location:document.getElementById('location').value.trim(),
  date:document.getElementById('date').value,
  time:document.getElementById('time').value,
  length:l,width:w,rate:r,area,total:totalAmt,paid:p,due:dueAmt
 };
}
function saveCustomer(){
 const c=getCustomerData();
 if(!c.name){
  alert('पहले Customer Name भरें।');
  document.getElementById('name').focus();
  return;
 }
 const records=JSON.parse(localStorage.getItem('mukeshPainterCustomers')||'[]');
 records.push(c);
 localStorage.setItem('mukeshPainterCustomers',JSON.stringify(records));
 calculate();
 renderCustomers();
 alert('Customer Save हो गया। अब Next Customer दबा सकते हैं।');
}
function renderCustomers(){
 const box=document.getElementById('customerList');
 if(!box) return;
 const records=JSON.parse(localStorage.getItem('mukeshPainterCustomers')||'[]');
 if(!records.length){ box.innerHTML='<p class="small">अभी कोई Customer Save नहीं है।</p>'; return; }
 box.innerHTML=records.slice().reverse().map((c,i)=>
  `<div style="border-top:1px solid #eee;padding:10px 0">
   <b>${c.name}</b> — ₹${Number(c.total).toFixed(2)}
   <div class="small">${c.mobile||'-'} | 📍 ${c.location||'-'} | ${c.date||'-'} ${c.time||''} | Paid ₹${Number(c.paid).toFixed(2)} | Due ₹${Number(c.due).toFixed(2)}</div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
   <button style="margin-top:0" onclick="whatsappCustomer(${c.id})">📲 WhatsApp</button>
   <button class="secondary" style="margin-top:0" onclick="deleteCustomer(${c.id})">🗑️ Delete</button>
  </div>
  </div>`).join('');
}

function whatsappCustomer(id){
 const records=JSON.parse(localStorage.getItem('mukeshPainterCustomers')||'[]');
 const c=records.find(x=>x.id===id);
 if(!c) return;
 const text=`🎨 Mukesh Painter Estimate%0ACustomer: ${encodeURIComponent(c.name||'-')}%0AMobile: ${encodeURIComponent(c.mobile||'-')}%0AWork Location: ${encodeURIComponent(c.location||'-')}%0ADate: ${c.date||'-'}%0ATime: ${c.time||'-'}%0AArea: ${Number(c.area||0).toFixed(2)} sq.ft%0ARate: ₹${Number(c.rate||0).toFixed(2)} / sq.ft%0ATotal: ₹${Number(c.total||0).toFixed(2)}%0APaid: ₹${Number(c.paid||0).toFixed(2)}%0ADue: ₹${Number(c.due||0).toFixed(2)}`;
 window.open('https://wa.me/?text='+text,'_blank');
}
function deleteAllCustomers(){
 const records=JSON.parse(localStorage.getItem('mukeshPainterCustomers')||'[]');
 if(!records.length){alert('Delete करने के लिए कोई Customer नहीं है।');return;}
 if(confirm('क्या सभी Customer records Delete करने हैं?')){
  localStorage.removeItem('mukeshPainterCustomers');
  renderCustomers();
 }
}
function deleteCustomer(id){
 const records=JSON.parse(localStorage.getItem('mukeshPainterCustomers')||'[]');
 const customer=records.find(c=>c.id===id);
 if(!customer) return;
 if(confirm('क्या "'+customer.name+'" का Customer रिकॉर्ड Delete करना है?')){
  const updated=records.filter(c=>c.id!==id);
  localStorage.setItem('mukeshPainterCustomers',JSON.stringify(updated));
  renderCustomers();
 }
}
function newCustomer(){
 // Saved customers remain in localStorage; only the new entry form is cleared.
 document.getElementById('name').value='';
 document.getElementById('mobile').value='';
 document.getElementById('location').value='';
 document.getElementById('length').value='';
 document.getElementById('width').value='';
 document.getElementById('rate').value='';
 document.getElementById('paid').value='';
 setNow();
 document.getElementById('total').textContent='0';
 document.getElementById('paidShow').textContent='0';
 document.getElementById('due').textContent='0';
 document.getElementById('summary').innerHTML='Details भरकर Calculate दबाएँ।';
 window.scrollTo({top:0,behavior:'smooth'});
}
function share(){
  calculate();
  const customer = $('name').value.trim() || '-';
  const mobileNo = $('mobile').value.trim() || '-';
  const area = ((parseFloat($('length').value)||0) * (parseFloat($('width').value)||0)).toFixed(2);

  const text =
    '🎨 Mukesh Painter Estimate\n' +
    'Customer: ' + customer + '\n' +
    'Mobile: ' + mobileNo + '\n' +
    'Date: ' + ($('date').value || '-') + '\n' +
    'Time: ' + ($('time').value || '-') + '\n' +
    'Area: ' + area + ' sq.ft\n' +
    'Total: ₹' + $('total').textContent + '\n' +
    'Paid: ₹' + $('paidShow').textContent + '\n' +
    'Due: ₹' + $('due').textContent;

  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}
</script>
</body>
</html>
